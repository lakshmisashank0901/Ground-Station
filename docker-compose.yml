# AI-assisted satellite ground station - complete software stack.
#   docker compose up --build          → http://localhost:3000 (UI), http://localhost:8000/docs (API)
#   docker compose --profile gateway up --build
#       additionally runs the standalone simulator as an external telemetry source posting to the
#       ingestion API (the path a future SAMRH gateway will use). Stop the in-process simulator from
#       the Simulation page first to avoid two interleaved streams.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}   # set to timescale/timescaledb:latest-pg16 + TIMESCALE_ENABLED=true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groundstation}
      POSTGRES_USER: ${POSTGRES_USER:-groundstation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        INSTALL_TF: ${INSTALL_TF:-true}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-groundstation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-groundstation}
      TIMESCALE_ENABLED: ${TIMESCALE_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      SIMULATOR_AUTOSTART: ${SIMULATOR_AUTOSTART:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  simulator:
    profiles: ["gateway"]
    build:
      context: ./backend
      args:
        INSTALL_TF: "false"
        TRAIN_AT_BUILD: "false"
    command: ["python", "-m", "app.simulation.standalone", "--url", "http://backend:8000", "--speed", "${SIM_SPEED:-1}"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
